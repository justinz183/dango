# Golden turns for the occupation model (docs/DESIGN.md §3). Each step
# goes through occupation::for_edit / for_command / for_tool and is priced
# as ingest does since 2026-11-07 (occupation::TurnSteps): a file counts once
# a turn (its lines or words summed), the k-th command or lookup of one
# occupation is worth 1/√k; the turn then gets remap + finish (5 min base and
# 12 min per subagent shared out by each occupation's part; prose at 2,000
# words an hour is a writer's; no cap since 2026-10-29). Values computed by
# an independent model (scratchpad golden/model.py) and priced with
# assets/occupations.toml.
