# Golden turns for the occupation model (docs/DESIGN.md §3). Each step
# goes through occupation::for_edit / for_command / for_tool; the turn
# then gets remap + finish (5 min base and 12 min per subagent on the main
# occupation, 360 min cap). Values computed by an independent model
# (scratchpad golden_occ.py) and priced with assets/occupations.toml.

[[case]]
name = "talk only"
main = "research"
minutes = 5.00
usd = 3.16

