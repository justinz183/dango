# Golden cases for the SPEC 5.3 formula. `h` is what the formula produces;
# `doc_h` is the value printed in the SPEC table where it differs (see
# docs/OPEN_QUESTIONS.md — two SPEC rows do not match its own formula).
# Tolerance: 0.5 minutes (SPEC 17.2).

[[case]]
name = "改一个配置项"
class = "config"
files = 1
lines = 3
h = 11.58
doc_h = 8.6

[[case]]
name = "中等重构并跑测试"
class = "refactor"
files = 6
lines = 252
test = true
h = 87.53

[[case]]
name = "新功能含提交"
class = "feature"
files = 12
lines = 800
test = true
merged = true
h = 194.56
doc_h = 175

[[case]]
name = "大迁移带 3 个子 agent"
class = "migration"
files = 40
lines = 3000
test = true
subagents = 3
merged = true
h = 360

