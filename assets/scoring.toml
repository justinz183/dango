# Scoring caps (SPEC 5.3). How many minutes each step is worth, and to whom,
# lives in crates/core/src/occupation.rs and assets/occupations.toml.
# Changing these may only keep or raise a user's historical total (SPEC 5.5).
version = "2.0"

[caps]
turn_max = 360            # one turn is worth at most six hours
minutes_per_day = 480     # one person-day
daily_person_days = 6
weekly_person_days = 30
