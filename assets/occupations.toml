# Who you would have hired (docs/DESIGN.md v6): one representative per
# field — the vet is the doctor, the accountant the financial analyst, the
# plumber the researcher (user, 2026-10-29). Each occupation is priced at
# the US national median hourly wage from the BLS Occupational Employment and
# Wage Statistics, May 2025, fetched 2026-10-29 from
# https://api.bls.gov/publicAPI/v2/timeseries/data/ (series
# OEUN0000000000000<SOC>08 = hourly median). Wages only, no benefits.
#
# scene        where its character works in the office (desk, studio, clinic,
#              gym, kitchen, classroom, court, lab, workshop, garden, lounge)
# consult      minutes a talk-only turn about it is worth
# absorbs_data python / sql steps in a turn about it are its work, not a
#              data scientist's
# look         what the widget draws on the character, by part name
# family       the topic family it belongs to (see [[family]])
# tell         words that pick it over the family's default; a specialty
#              needs one, the default has none
# strong/weak  topic keywords (2 and 1 points; a prompt needs 2 points).
#              ASCII keywords match whole words; others match anywhere.
source = "BLS OEWS May 2025, national hourly median"
label = "按美国劳工统计局 2025 年 5 月各职业时薪中位数折算"
as_of = "2026-10-29"

# Occupations merged into their field's representative (2026-10-29). Old
# events and turns still name them; they count as the representative.
[alias]
secops = "swe"
vet = "doctor"
dietitian = "doctor"
pharmacist = "doctor"
accountant = "fin"
economist = "fin"
translator = "writer"
ux = "designer"
interior = "designer"
photographer = "designer"
mech = "physicist"
ee = "physicist"
tutor = "research"
electrician = "research"
plumber = "research"
carpenter = "research"
gardener = "research"
childcare = "research"
travel = "research"
realtor = "research"
mechanic = "research"
fashion = "research"
stylist = "research"
manager = "research"
pm = "research"
hr = "research"
sales = "research"

# Topic families (docs/DESIGN.md v6): a prompt is placed in the family
# whose members' keywords score most, then with the member whose `tell`
# words appear, else the family's `default`. Since the table was cut to
# one representative per field (2026-10-29), only tech and health have
# more than one member; in tech, web / qa / ops are recognised by their
# steps (files, commands), not by prompts, and have no keywords.
[[family]]
id = "tech"
name = "技术"
default = "swe"

[[family]]
id = "health"
name = "医疗健康"
default = "doctor"

[[family]]
