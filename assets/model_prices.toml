# What the models cost per million tokens (docs/DESIGN.md v5): the
# denominator of the economic leverage (what the work would have cost a
# person ÷ what the models cost at API prices). Standard tier, global
# routing, USD. Fetched 2026-10-29 from the official pages:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    https://developers.openai.com/api/docs/pricing
# `cache_write` is the short-lived write (Anthropic 5 min, OpenAI 30 min),
# `cache_write_long` the long one (Anthropic 1 h, OpenAI 12 h); `cache_read`
# is "cache hits and refreshes" / "cached input". An id ending in "@long" is
# the price for a request over the model's long-context threshold. A model
# not listed here is unpriced: its tokens are counted, its cost is not.
source = "Anthropic and OpenAI API pricing pages, standard tier"
as_of = "2026-10-29"

[[model]]
id = "claude-fable-5-1"
input = 10.0
cache_write = 12.5
cache_write_long = 20.0
cache_read = 0.25
output = 50.0

