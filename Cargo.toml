[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.5"
edition = "2021"

[workspace.dependencies]
dango-core = { path = "crates/core" }
daemon = { path = "crates/daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
